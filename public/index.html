<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>היום שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gveret+Levin&family=Heebo:wght@500;700;800&family=Suez+One&display=swap" rel="stylesheet">
<style>:root{--ink:#1f1a2e;--ink-fixed:#1f1a2e;--paper:#fbf4e6;--paper2:#f1e4c8;--card:#fffdf6;--green:#16b04a;--green-d:#0c7a32;--pink:#ff9ccb;--pink-l:#ffd3e7;--lav:#b9a4f7;--lav-l:#ddd2fb;--orange:#ff5b2e;--lime:#cbf03a;--lime-l:#e7f8a0;--tape:#ffe27a;--m:16px;--g:10px;--navh:104px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f4ecdc;--paper:#1c1727;--paper2:#2a2338;--card:#272034;--pink-l:#5a3a52;--lav-l:#3c3458;--lime-l:#4a5424}}
:root[data-theme="dark"]{--ink:#f4ecdc;--paper:#1c1727;--paper2:#2a2338;--card:#272034;--pink-l:#5a3a52;--lav-l:#3c3458;--lime-l:#4a5424}
@media (min-width:700px){:root{--m:40px;--g:16px;--navh:94px}}
@media (min-width:1100px){:root{--m:120px;--g:24px}}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:'Heebo',system-ui,sans-serif;font-weight:500;font-size:18px;line-height:1.3;direction:rtl;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(var(--ink) 1.2px,transparent 1.8px),radial-gradient(var(--ink) 1px,transparent 1.6px);background-size:97px 89px,61px 73px;background-position:0 0,23px 31px;opacity:.07;pointer-events:none;z-index:0}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.hand{font-family:'Gveret Levin',cursive;font-weight:400}
.suez{font-family:'Suez One',serif;font-weight:400}
.g{display:block;width:100%;height:100%;overflow:visible}
.ic{flex:none;display:block}
.hide{display:none!important}
#app{position:relative;z-index:1;min-height:100vh}
.page{position:relative;padding:calc(var(--navh) + 22px) var(--m) 56px;max-width:1440px;margin:0 auto}
.cols{display:grid;grid-template-columns:repeat(4,1fr);column-gap:var(--g);row-gap:28px;align-items:start}
.cols>*{grid-column:1/-1;min-width:0}
@media (min-width:1100px){.cols>.c2{grid-column:span 2}.cols>.c1{grid-column:span 1}.cols>.c3{grid-column:span 3}}
.stack{display:flex;flex-direction:column;gap:22px;min-width:0}
.row{display:flex;align-items:center;gap:12px}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
/* ---------- top nav ---------- */
.top{position:fixed;inset-inline:0;top:0;z-index:50;background:var(--paper);border-bottom:2px dotted color-mix(in srgb,var(--ink) 55%,transparent);padding:14px var(--m);padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.rail{display:flex;gap:4px;background:var(--card);border:2.5px solid var(--ink);border-radius:999px;padding:6px}
.tab{display:flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;font-weight:700;font-size:18px;color:var(--ink);border:2.5px solid transparent;background:none;text-decoration:none;white-space:nowrap}
.tab.on{background:var(--lime);border-color:var(--ink);box-shadow:-3px 3px 0 var(--ink);color:var(--ink-fixed)}
.logo{display:flex;align-items:center;gap:10px;font-family:'Suez One';font-size:36px;line-height:1;color:var(--ink);text-decoration:none;background:none;border:0;padding:0}
.logo .g{width:44px;height:44px}
.me{display:flex;align-items:center;gap:10px;background:var(--card);border:2.5px solid var(--ink);border-radius:999px;padding:6px 8px 6px 18px;font-weight:700;cursor:pointer;color:var(--ink)}
.av{width:40px;height:40px;border-radius:46% 28% 46% 28%;border:2px solid var(--ink);background:var(--lav);overflow:hidden;flex:none;box-shadow:-2px 2px 0 var(--ink);position:relative;display:grid;place-items:center}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av .g{width:100%;height:100%}
.av.l{width:150px;height:150px;border-width:3px;box-shadow:-6px 6px 0 var(--ink)}
.av.m{width:72px;height:72px;border-width:2.5px;box-shadow:-3px 3px 0 var(--ink)}
.av.round{border-radius:50%}
@media (max-width:699px){
 .top{padding-block:10px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
 .top .logo,.top .me b{display:none}.me{padding:4px}
 .rail{flex:1;padding:5px;border-radius:28px}
 .tab{flex:1;flex-direction:column;gap:2px;padding:8px 4px;font-size:13px;border-radius:18px;justify-content:center}
 .top{gap:8px}
}
@media (min-width:700px) and (max-width:1099px){.top .logo span{display:none}.top .me b{display:none}.me{padding:4px}.tab{padding:8px 14px}}
/* ---------- buttons / inputs ---------- */
.btn{font-weight:700;font-size:20px;padding:10px 28px;border-radius:999px;border:2.5px solid var(--ink);display:inline-flex;gap:10px;align-items:center;justify-content:center;color:var(--ink-fixed);background:var(--card);text-decoration:none;white-space:nowrap;line-height:1.2}
.btn.primary{background:var(--green);box-shadow:-4px 4px 0 var(--ink)}
.btn.primary:active{background:var(--green-d);color:#fffdf6;box-shadow:-2px 2px 0 var(--ink)}
.btn.secondary{background:var(--card);border-style:dashed;color:var(--ink)}
.btn.sticker{background:var(--pink);border-radius:18px;font-family:'Gveret Levin';font-weight:400;font-size:34px;box-shadow:-6px 6px 0 var(--ink);padding:6px 28px}
.btn.danger{background:var(--orange);box-shadow:-3px 3px 0 var(--ink)}
.btn.lime{background:var(--lime);box-shadow:-3px 3px 0 var(--ink)}
.btn.block{width:100%}.btn.big{min-height:64px}.btn.sm{font-size:16px;padding:6px 16px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.ghost{background:none;border:2px dashed var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.ghost.red{border-color:var(--orange);color:var(--orange)}
.icbtn{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;color:var(--ink);padding:0;flex:none}
.icbtn.big{width:52px;height:52px;border-width:2.5px;box-shadow:-3px 3px 0 var(--ink)}
.more{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:var(--card);display:flex;gap:3px;align-items:center;justify-content:center;padding:0;flex:none}
.more i{width:4.5px;height:4.5px;background:var(--ink);border-radius:50%;display:block}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-weight:700;font-size:14px}
.in{font-family:'Heebo',system-ui,sans-serif;font-weight:700;appearance:none;-webkit-appearance:none;font-size:20px;border:2.5px dashed var(--ink);border-radius:16px;background:var(--card);color:var(--ink);padding:6px 18px;height:56px;width:100%;min-width:0;direction:rtl;text-align:start;overflow:visible}
.in:focus{border-style:solid;box-shadow:-4px 4px 0 var(--ink);outline:none}
.in.ok{background:var(--lime-l);border-style:solid}
.in.err{background:var(--pink-l);border-color:var(--orange)}
.in.num{text-align:center}
.in.sm{height:44px;font-size:20px;border-width:2px;border-radius:14px;padding:4px 12px}
textarea.in{height:auto;min-height:56px;padding:10px 16px;resize:vertical}
select.in{font-family:'Heebo';font-weight:700;font-size:16px}
input[type=time].in,input[type=date].in{direction:ltr;text-align:center;font-family:'Suez One';font-size:22px}
.quick{display:flex;flex-wrap:wrap;gap:8px}.quick .chip{font-size:15px;padding:5px 14px;background:var(--card)}.quick .chip small{font-family:'Suez One';font-size:13px;opacity:.75}
.res{display:grid;grid-template-columns:1fr 1fr;gap:12px}.res .note{padding:8px 14px}
details.how{border:2px dashed var(--ink);border-radius:14px;padding:6px 14px;background:var(--card)}details.how summary{cursor:pointer;font-weight:700;font-size:15px}details.how li{font-size:15px;margin:4px 0}
.err-t{color:var(--orange);font-family:'Gveret Levin';font-size:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:999px;border:2px dashed var(--ink);font-weight:700;font-size:14px;background:none;color:var(--ink)}
.chip.on{background:var(--lime);border:2.5px solid var(--ink);box-shadow:-2px 2px 0 var(--ink);color:var(--ink-fixed)}
.chip.pink{background:var(--pink-l);border-style:solid;color:var(--ink)}
.seg{display:flex;gap:4px;padding:5px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card)}
.seg .chip{flex:1;justify-content:center;border-color:transparent}
.seg .chip.on{border-color:var(--ink)}
/* ---------- stickers / titles ---------- */
.stitle{position:relative;display:inline-flex;align-items:center;font-family:'Suez One';font-size:clamp(32px,4vw,56px);line-height:1;padding:10px clamp(20px,3vw,36px);border:2.5px solid var(--ink);border-radius:48px 22px 48px 22px;box-shadow:-6px 6px 0 var(--ink);color:var(--ink-fixed);white-space:nowrap}
.stitle>.dc{position:absolute;top:-30px;inset-inline-end:auto;inset-inline-start:-28px;width:clamp(36px,4.5vw,64px);height:clamp(36px,4.5vw,64px)}
.stitle.pink{background:var(--pink)}.stitle.lime{background:var(--lime)}.stitle.lav{background:var(--lav)}.stitle.org{background:var(--orange)}.stitle.grn{background:var(--green)}.stitle.tp{background:var(--tape)}
.sheetwrap{position:relative;margin-top:30px}
.sheetwrap::before,.sheetwrap::after{content:'';position:absolute;inset:0;border:2.5px solid var(--ink);border-radius:48px;z-index:0}
.sheetwrap::before{background:var(--lime);transform:translate(10px,12px) rotate(1.3deg)}
.sheetwrap::after{background:var(--pink);transform:translate(-6px,15px) rotate(-1.1deg)}
.sheetwrap.alt::before{background:var(--lav)}.sheetwrap.alt::after{background:var(--lime)}
.sheet{position:relative;z-index:1;background:var(--lav-l);border:2.5px solid var(--ink);border-radius:56px 20px 56px 20px;padding:78px 28px 26px}
.sheet.white{background:var(--card)}
.sheet>.stitle{position:absolute;top:-38px;inset-inline-start:36px}
.note{position:relative;background:var(--card);border:2.5px dashed var(--ink);border-radius:36px 16px 36px 16px;padding:22px 20px 18px}
.note.solid{border-style:solid}
.tape{position:absolute;width:96px;height:28px;top:-14px;inset-inline-start:50%;margin-inline-start:-48px;transform:rotate(-4deg);pointer-events:none;z-index:3}
.dec{position:absolute;pointer-events:none;z-index:0}
.stk{position:relative;display:grid;place-items:center;flex:none}
.stk>.g{position:absolute;inset:0}
.stk>span{position:relative;font-family:'Suez One';color:var(--ink-fixed)}
.pt{font-family:'Gveret Levin';font-size:34px;line-height:1.1}
.ptn{font-family:'Gveret Levin';font-size:24px;line-height:1.15}
.pts{font-family:'Gveret Levin';font-size:20px;line-height:1.15;opacity:.8}
/* ---------- header (today) ---------- */
.hero{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:26px}
.h-title{position:relative;text-align:start}
.h-title h1{font-family:'Suez One';font-size:clamp(64px,10.5vw,160px);line-height:.88;position:relative;z-index:2;margin:0}
.h-title .blob{position:absolute;inset-inline-start:30%;top:36%;width:60%;height:78%;z-index:1}
.h-title .fl{position:absolute;inset-inline-end:100%;margin-inline-end:-30px;top:2%;width:clamp(56px,9vw,150px);z-index:2;transform:rotate(14deg)}
.datetag{position:relative;z-index:3;display:inline-block;margin-top:-10px;background:var(--card);border:2.5px solid var(--ink);border-radius:12px;padding:6px 20px;box-shadow:-5px 5px 0 var(--ink);transform:rotate(-3deg);font-size:clamp(20px,2.2vw,34px)}
.datetag .tape{width:70px;top:-12px;inset-inline-start:60%}
.msg{position:relative;z-index:2;margin-top:14px;display:flex;align-items:center;gap:10px;font-size:clamp(18px,2vw,24px)}
.score-cl{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.score-big{width:clamp(170px,22vw,240px);height:clamp(170px,22vw,240px);position:relative;transform:rotate(-7deg)}
.score-big .g{position:absolute;inset:0}
.score-big .in-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink-fixed)}
.score-big .n{font-family:'Suez One';font-size:clamp(54px,7vw,80px);line-height:.95}
.score-big small{font-family:'Gveret Levin';font-size:clamp(14px,1.6vw,20px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:260px}
.chipx{display:inline-flex;gap:8px;align-items:center;padding:4px 16px;border-radius:999px;border:2px solid var(--ink);box-shadow:-3px 3px 0 var(--ink);font-weight:700;font-size:14px;color:var(--ink-fixed)}
.chipx b{font-family:'Suez One';font-weight:400;font-size:18px}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;font-family:'Gveret Levin';font-size:20px;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.linkbtn i{width:22px;height:22px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:'Heebo';font-weight:800;font-size:13px}
/* ---------- tasks ---------- */
.tlist{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:2px dashed color-mix(in srgb,var(--ink) 70%,transparent)}
.task .lab{flex:1;font-weight:700;font-size:20px;text-align:start;min-width:0;overflow-wrap:anywhere}
.task.done .lab{opacity:.9}
.ck{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--ink);background:var(--card);display:grid;place-items:center;padding:0;flex:none;color:var(--ink-fixed)}
.ck.on{background:var(--lime);box-shadow:-2px 2px 0 var(--ink)}
.ck.green.on{background:var(--green)}
.addrow{margin-top:12px;display:flex;align-items:center;gap:10px;border:2.5px dashed var(--ink);border-radius:18px;padding:8px 14px;background:none;width:100%;font-family:'Gveret Levin';font-size:30px;color:var(--ink);justify-content:flex-start}
.addrow .pl{width:38px;height:38px;border-radius:50%;background:var(--lime);border:2.5px solid var(--ink);display:grid;place-items:center;color:var(--ink-fixed);flex:none}
.addform{margin-top:12px;display:flex;gap:10px;align-items:center}
/* ---------- schedule ---------- */
.legend{display:flex;gap:18px;justify-content:flex-start;flex-wrap:wrap;margin-bottom:14px;font-weight:700;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.blocks{display:flex;flex-direction:column;gap:14px}
.block{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;border:2px dashed var(--ink);background:var(--card);min-width:0}
.block.done{background:var(--lime-l);border:2.5px solid var(--ink);box-shadow:-3px 3px 0 var(--ink)}
.block.missed{background:var(--pink-l);border-style:dashed}
.block .bt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.block .bt b{font-size:20px;overflow-wrap:anywhere;text-align:start}
.note-in{display:inline-flex;gap:8px;padding:2px 12px;border-radius:999px;background:var(--card);border:1.5px dashed var(--ink);font-weight:700;font-size:14px;color:var(--ink)}
.range{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 10px;border-radius:20px;border:2.5px solid var(--ink);background:var(--card);font-family:'Suez One';font-size:18px;line-height:1.05;flex:none;color:var(--ink)}
.range i{width:12px;height:14px;display:block;color:var(--ink)}
.block.done .range{background:var(--green);color:var(--ink-fixed)}
.block.missed .range{background:var(--pink);border-style:dashed;color:var(--ink-fixed)}
.sico{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;background:var(--card);padding:0;flex:none;color:var(--ink-fixed)}
.sico.done{background:var(--green)}.sico.missed{background:var(--pink-l);border-style:dashed;color:var(--ink)}
.empty{text-align:center;font-family:'Gveret Levin';font-size:24px;padding:18px 8px;opacity:.75}
/* ---------- steps ---------- */
.steps{position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:32px 12px 32px 12px;padding:14px 20px 16px;box-shadow:-4px 4px 0 var(--ink);display:flex;flex-direction:column;gap:10px}
.steps .num{font-family:'Suez One';font-size:clamp(34px,4vw,56px);line-height:1}
.track{height:26px;border-radius:999px;border:2.5px solid var(--ink);background:var(--card);overflow:hidden;position:relative}
.track>i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--green);display:block;transition:width .4s}
.track.full>i{background:var(--lime)}
/* ---------- journal ---------- */
.journal{background:var(--card);border:2.5px solid var(--ink);border-radius:14px 40px 14px 40px;padding:24px 22px 16px;position:relative;box-shadow:-4px 4px 0 var(--ink)}
.journal textarea{width:100%;border:0;background:repeating-linear-gradient(transparent 0 38px,var(--lav) 38px 40px);font-family:'Heebo',system-ui,sans-serif;font-weight:500;font-size:20px;line-height:40px;color:var(--ink);resize:none;min-height:200px;outline:none;padding:0 4px;direction:rtl}
/* ---------- food band ---------- */
.foodband{position:relative;margin-top:72px;background:var(--green);padding:130px var(--m) 70px;z-index:1}
.foodband .wave{position:absolute;inset-inline:0;top:-26px;height:60px;width:100%}
.foodband .fin{max-width:1440px;margin:0 auto;padding-inline:0}
@media (min-width:1100px){.foodband{padding-inline:120px}}
.foodband>.stitle{position:absolute;top:34px;inset-inline-start:max(var(--m),calc((100vw - 1440px)/2 + var(--m)))}
.ftool{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:34px}
.ntotal{background:var(--card);border:2.5px solid var(--ink);border-radius:36px 14px 36px 14px;padding:14px 22px 16px;box-shadow:-5px 5px 0 var(--ink);display:flex;flex-direction:column;gap:8px;min-width:min(588px,100%);flex:1;max-width:588px}
.ntotal .itm{display:flex;align-items:center;gap:12px;flex:1}
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:34px var(--g)}
.meal{position:relative;display:flex;flex-direction:column;gap:12px;min-width:0}
.meal h3{display:flex;align-items:center;gap:10px;font-family:'Suez One';font-weight:400;font-size:clamp(26px,3vw,36px);color:var(--ink-fixed)}
.meal h3 .g{width:42px;height:42px}
.slip{position:relative;border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;text-align:start;min-height:84px;border:2px dashed var(--ink);width:100%;background:var(--lav-l);color:var(--ink-fixed)}
.slip .lb{align-self:flex-start;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:0 12px;font-size:13px;font-weight:800}
.slip.plan{cursor:pointer}
.slip.act{border:2.5px solid var(--ink);box-shadow:-3px 3px 0 var(--ink)}
.slip.act.fol{background:var(--lime-l)}.slip.act.dif{background:var(--pink-l)}
.slip.empty-act{background:transparent;border:2.5px dotted var(--ink);color:var(--ink-fixed);cursor:pointer}
.slip .x{font-family:'Gveret Levin';font-size:24px;line-height:1.15}
.slip .m2{position:absolute;inset-inline-end:auto;inset-inline-start:8px;top:8px}
.nchips{display:flex;gap:6px;flex-wrap:wrap}
.nchip{border:1.5px solid var(--ink);border-radius:999px;padding:1px 10px;font-weight:800;font-size:13px;color:var(--ink-fixed)}
.signoff{margin-top:44px;text-align:center;font-family:'Gveret Levin';font-size:clamp(24px,3vw,34px);color:var(--ink-fixed);display:flex;gap:14px;justify-content:center;align-items:center}
.signoff .g{width:40px;height:40px}
.planin{width:100%;font-family:'Heebo',system-ui,sans-serif;font-weight:700;font-size:18px;border:0;background:transparent;color:var(--ink-fixed);outline:2px dashed var(--ink);border-radius:8px;padding:4px 8px;direction:rtl}
/* ---------- popups ---------- */
.scrim{position:fixed;inset:0;background:rgba(31,26,46,.6);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:max(18px,env(safe-area-inset-top,0px)) 14px 28px;overflow:auto}

  const seen=new Set(),same=[],other=[];const dates=Object.keys(S.days).sort().reverse().slice(0,90);

  return same.concat(other).slice(0,6);
}

async function estimateFood(text){
  if(S.mode==='api'){try{return await Api.post('/api/estimate',{text})}catch(e){throw{code:e.code==='ai_unavailable'?'unavailable':e.code==='ai_limit'?'limit':'err'}}}
  const sample=window.claude&&window.claude.use?await window.claude.use('sample'):null;
  if(!sample)throw{code:'unavailable'};
  const prompt=`אתה עוזר תזונה. המשתמש תיאר ארוחה בטקסט חופשי. פרק אותה לרכיבים והערך לכל רכיב קלוריות וחלבון (בגרמים) לפי הכמות שצוינה. אם לא צוינה כמות, הנח מנה סבירה וכתוב אותה בשדה amount. היה ריאליסטי ועגל למספרים שלמים.\nהתיאור: "${text.replace(/"/g,"'")}"\n\nהחזר JSON בלבד, בלי טקסט נוסף, בפורמט: {"items":[{"name":"","amount":"","kcal":0,"protein":0}]}. עד 12 רכיבים.`;
  const r=await sample.json(prompt,{modelTier:'quick',cache:false});
  if(!r||!Array.isArray(r.items)||!r.items.length||r.items.length>12)throw{code:'bad_shape'};
  const num=v=>{v=Math.round(+v);if(!isFinite(v)||v<0||v>6000)throw{code:'bad_value'};return v};
  const its=r.items.map(x=>({name:String(x.name||'').slice(0,60)||'רכיב',amount:String(x.amount||'').slice(0,40),kcal:num(x.kcal),protein:num(x.protein)}));
  return{items:its,kcal:its.reduce((s,x)=>s+x.kcal,0),protein:its.reduce((s,x)=>s+x.protein,0)};
}

};

const SocialDb={on:false,profiles:{},links:{},pcIn:{},pcOut:[],pcSubs:{},timer:null,lastPub:'',err:false,
  me(){return S.uid},
  async init(){

      db.collection('postcards/'+me+'/sent').onSnapshot(sn=>{this.pcOut=sn.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.at||0)-(a.at||0));this.changed()},()=>{});
    }catch(e){this.on=false}

  },
  changed(){if(['friends','friend','postcards','zine'].includes(S.route.name))softRender()},

  outgoing(){const f=this.friendIds();return this.mine().filter(u=>!f.includes(u)&&this.profiles[u])},

};

function friendStreak(sc){let n=0,s=todayStr();if((sc[s]||0)>=60)n++;s=addDays(s,-1);for(let i=0;i<400;i++){if((sc[s]||0)>=60){n++;s=addDays(s,-1)}else break}return n}
const mySc=()=>{const o={},t=todayStr();for(let i=0;i<120;i++){const d=addDays(t,-i),v=scoreOf(d);if(v!=null)o[d]=v}return o};
function bestStreak(sc){let best=0,cur=0;const t=todayStr();for(let i=119;i>=0;i--){const v=sc[addDays(t,-i)];if(v!=null&&v>=60){cur++;if(cur>best)best=cur}else cur=0}return best}
function rankRows(){
  const rows=[];const msc=mySc();rows.push({id:'me',mine:true,name:S.profile.name,p:S.profile,streak:friendStreak(msc),best:bestStreak(msc)});
  for(const id of Social.friendIds()){const p=Social.profiles[id];if(!p)continue;const sc=p.scores||{};rows.push({id,mine:false,name:p.name,p,streak:friendStreak(sc),best:bestStreak(sc)})}
  rows.sort((a,b)=>b.streak-a.streak||b.best-a.best||(a.mine?-1:b.mine?1:0)||a.name.localeCompare(b.name,'he'));
  rows.forEach((r,i)=>{const f=rows.findIndex(x=>x.streak===r.streak&&x.best===r.best);r.rank=f+1});return rows;
}

function fMonthStats(sc,y,m){const n=new Date(y,m+1,0).getDate();let sum=0,c=0,best=null,bd=null,great=0,good=0,soft=0,emp=0;for(let d=1;d<=n;d++){const s=`${y}-${pad2(m+1)}-${pad2(d)}`;if(s>todayStr())continue;const v=sc[s];if(v==null){emp++;continue}sum+=v;c++;if(best==null||v>best){best=v;bd=s}const t=tierOf(v);if(t==='great')great++;else if(t==='good')good++;else soft++}return{avg:c?Math.round(sum/c):null,best,bd,great,good,soft,emp}}
PAGES.friend=r=>{

  const now=new Date();if(!S.fcal)S.fcal={y:now.getFullYear(),m:now.getMonth()};const {y,m}=S.fcal;const sc=p.scores||{};const t=todayStr();

  for(let i=0;i<rows*7;i++){const dn=i-off+1;if(dn<1||dn>n){const d=new Date(y,m,dn);cells+=`<div class="cell out"><span class="d">${d.getDate()}</span></div>`;continue}
    const s=`${y}-${pad2(m+1)}-${pad2(dn)}`;const v=sc[s];const tr=tierOf(v==null?null:v);

  <div class="cols"><div class="c3"><div class="sheetwrap alt"><div class="sheet white" style="padding:26px 24px 18px;border-radius:56px 20px 56px 20px">${tapeEl()}<div class="calgrid">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div><div class="hint" style="justify-content:flex-start;margin-top:12px">${ico('check',16)} לחצו על יום כדי להדביק מדבקה או לשלוח גלויה</div></div></div></div>
  <div class="c1 sumcol"><div style="align-self:center;width:200px;height:200px;position:relative;transform:rotate(-4deg)">${st.avg==null?`<svg class="g" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--ink)" stroke-width="3" stroke-dasharray="6 6"/></svg>`:tierShape(avgT,st.avg)}<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:${st.avg==null?'var(--ink)':'var(--ink-fixed)'}"><small class="hand" style="font-size:18px">ממוצע של ${esc(p.name)}</small><span class="suez" style="font-size:56px;line-height:1">${st.avg==null?'—':st.avg}</span><small class="hand" style="font-size:18px">${PRAISE[avgT]}</small></div></div>

  <div class="dropz">${d.photo?`<img alt="תמונה שנבחרה" src="${esc(d.photo)}">`:`${ico('camera',44)}<span class="pt">הוסיפו תמונה</span>`}<div class="row" style="gap:10px;flex-wrap:wrap;justify-content:center"><label class="ghost" style="cursor:pointer">${ico('image',18)} מהגלריה<input type="file" accept="image/*" hidden data-ch="pc-file"></label><label class="ghost" style="cursor:pointer">${ico('camera',18)} צילום עכשיו<input type="file" accept="image/*" capture="environment" hidden data-ch="pc-file"></label>${d.photo?`<button type="button" class="ghost red" data-act="pc-nophoto">${ico('trash',16)} הסרה</button>`:''}</div></div>
  <div class="field"><label for="pn">מה כותבים על הגלויה?</label><input id="pn" class="in" maxlength="100" value="${esc(d.note)}" placeholder="איזה יום! גאה בך" data-in="pc-note" data-focus="1"></div>
  <div class="row" style="gap:6px;flex-wrap:wrap"><b>מדבקה</b>${STICKERS.map(s=>`<button type="button" class="opt ${d.sticker===s[0]?'on':''}" style="width:48px;height:48px" data-act="pc-sticker" data-s="${s[0]}" aria-label="מדבקה">${s[1]()}</button>`).join('')}</div>
  ${d.err?`<div class="err-t" role="alert">${esc(d.err)}</div>`:''}<div class="acts"><span class="sp"></span><button class="btn secondary" type="button" data-act="close-popup">ביטול</button><button class="btn primary" type="button" data-act="pc-send" ${d.sending?'disabled':''}>${d.sending?'שולחים…':'שליחה'} ${ico('mail',20)}</button></div></div>`}};
ACT['pc-to']=el=>{const d=S.popup.d,id=el.dataset.id;const i=d.to.indexOf(id);if(i>=0)d.to.splice(i,1);else d.to.push(id);renderPopup()};
ACT['pc-sticker']=el=>{S.popup.d.sticker=el.dataset.s;renderPopup()};ACT['pc-nophoto']=()=>{S.popup.d.photo=null;renderPopup()};
INP['pc-note']=el=>{S.popup.d.note=el.value};
INP['pc-file']=async el=>{const f=el.files&&el.files[0];if(!f)return;const d=S.popup.d;try{d.photo=await resizeImage(f,720,.72);d.err=''}catch(e){d.err='לא הצלחנו לקרוא את התמונה'}renderPopup()};
ACT['pc-send']=async()=>{const d=S.popup.d;if(!d.to.length){d.err='צריך לבחור למי לשלוח';return renderPopup()}if(!d.photo&&!(d.note||'').trim()){d.err='צריך להוסיף תמונה או שורה בכתב יד';return renderPopup()}
  d.sending=true;d.err='';renderPopup();const pp=S.popup;
  try{await Social.send({to:d.to,note:(d.note||'').trim(),sticker:d.sticker,photo:d.photo||null,day:d.day||null});if(S.popup!==pp)return;closePopup();toast('הגלויה נשלחה!');if(S.route.name==='postcards'){S.ui.ptab='out';render(true)}}
  catch(e){if(S.popup!==pp)return;d.sending=false;d.err='לא הצלחנו לשלוח. אולי התמונה גדולה מדי, או שחסרה הרשאת כתיבה';renderPopup()}};
/* ---------------- weekly zine ---------------- */
function zineData(){const t=todayStr();const days=[];for(let i=6;i>=0;i--){const s=addDays(t,-i);days.push({s,v:scoreOf(s)})}const sc=days.filter(x=>x.v!=null);const avg=sc.length?Math.round(sc.reduce((a,b)=>a+b.v,0)/sc.length):null;const best=sc.reduce((a,b)=>!a||b.v>a.v?b:a,null);const stepsAvg=Math.round(days.reduce((a,d)=>a+((S.days[d.s]&&S.days[d.s].steps)||0),0)/7);return{days,sc,avg,best,stepsAvg,streak:streak()}}
PAGES.zine=()=>{
  const z=zineData();const first=z.days[0].s,last=z.days[6].s;
  const quote=!z.sc.length?'עוד אין מדבקות השבוע. התחילו להזין, והגיליון ימלא את עצמו.':z.streak>=3?`שבוע של רצף! ${z.streak} ימים רצופים שעמדת ביעד.`:z.avg>=75?'שבוע חזק. הממוצע שלך גבוה, תמשיכו ככה!':'שבוע של התחלות. כל מדבקה נחשבת.';
  const cards=Social.on?Social.cardsIn().filter(c=>c.at>=Date.now()-7*864e5&&c.photo).slice(0,2):[];
  const dayCol=d=>{const t=tierOf(d.v);return `<div><span>${WD[pdate(d.s).getDay()]}</span><span class="stk" style="aspect-ratio:1;transform:rotate(${t==='great'?-5:t==='good'?4:-3}deg)">${d.v==null?`<svg class="g" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--ink)" stroke-width="3" stroke-dasharray="6 6" opacity=".5"/></svg>`:tierShape(t,d.v)}<span style="font-size:20px">${d.v==null?'':d.v}</span></span></div>`};
  return `<main class="page"><div class="rowb" style="margin-bottom:22px"><div class="row" style="gap:12px;flex-wrap:wrap"><button class="btn primary" data-act="zine-share">${ico('share',20)} שיתוף בוואטסאפ</button><button class="btn secondary" data-act="zine-dl" id="zdl">${ico('up',20)} הורדה כתמונה</button></div><div class="row" style="gap:16px;flex-wrap:wrap"><div class="datetag" style="margin:0;font-family:'Gveret Levin';font-size:28px;transform:rotate(-2deg)">${esc(shortDate(first))} – ${esc(shortDate(last))}</div>${stitle('lav','הגיליון השבועי',GX.star(COL.lime))}</div></div>
  <div class="cols"><div class="c2" style="position:relative;min-height:440px"><span class="dec" style="inset-inline-start:30px;top:30px;width:min(420px,70%);aspect-ratio:1.4">${GX.blob(COL.pink,2)}</span><div style="position:relative;z-index:1;display:grid;place-items:center;padding:20px 0">${z.best?`<div class="score-big" style="transform:rotate(-6deg)">${tierShape(tierOf(z.best.v),z.best.v)}<div class="in-t"><small>היום הכי טוב · ${WD[pdate(z.best.s).getDay()]}</small><span class="n">${z.best.v}</span><small>${PRAISE[tierOf(z.best.v)]}</small></div></div>`:`<div class="note"><div class="pt">עוד אין יום מוביל</div></div>`}</div>${cards.length?`<div class="pgrid" style="grid-template-columns:repeat(2,1fr);margin-top:10px">${cards.map(c=>pcardHtml(c,'in')).join('')}</div>`:''}</div>
  <div class="c2"><div class="sheetwrap alt"><div class="sheet white" style="padding:30px 22px 22px">${tapeEl()}<div class="zine-days" style="margin-bottom:18px">${z.days.slice().reverse().map(dayCol).join('')}</div><div class="row" style="gap:10px;margin-bottom:16px;flex-wrap:wrap"><div class="statn grow" style="background:var(--lav-l);justify-content:center;flex-direction:column;gap:0"><b>${z.best?z.best.v:'–'}</b><span class="pts">היום הכי טוב</span></div><div class="statn grow" style="background:var(--pink-l);justify-content:center;flex-direction:column;gap:0"><b>${z.streak}</b><span class="pts">ימים ברצף</span></div><div class="statn grow" style="background:var(--lime-l);justify-content:center;flex-direction:column;gap:0"><b>${z.avg==null?'–':z.avg}</b><span class="pts">ממוצע השבוע</span></div></div><div class="pt">${esc(quote)}</div><div class="row" style="gap:8px;margin-top:10px"><b>בממוצע ${fmtNum(z.stepsAvg)} צעדים ביום</b></div></div></div></div></div></main>`;
};
function zineText(z){return `הגיליון השבועי שלי ב"היום שלי":\n${z.days.map(d=>`${WD[pdate(d.s).getDay()]} ${d.v==null?'—':d.v}`).join(' · ')}\nממוצע ${z.avg==null?'—':z.avg}, ${z.streak} ימים ברצף${z.best?`, היום הכי טוב ${z.best.v}`:''}`}
ACT['zine-share']=()=>whatsapp(zineText(zineData()));
function scallop(ctx,cx,cy,r,n){ctx.beginPath();for(let i=0;i<=240;i++){const t=i/240*Math.PI*2,rr=r*(0.84+0.1*Math.cos(n*t));const x=cx+rr*Math.cos(t),y=cy+rr*Math.sin(t);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}
ACT['zine-dl']=async()=>{
  const z=zineData();
  try{await Promise.all([document.fonts.load('80px "Suez One"'),document.fonts.load('40px "Gveret Levin"'),document.fonts.load('700 30px Heebo')])}catch(e){}
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.direction='rtl';x.textAlign='center';
  x.fillStyle='#fbf4e6';x.fillRect(0,0,W,H);x.fillStyle='#1f1a2e';x.font='110px "Suez One",serif';x.fillText('הגיליון השבועי',W/2,170);x.font='44px "Gveret Levin",cursive';x.fillText(`${shortDate(z.days[0].s)} – ${shortDate(z.days[6].s)}`,W/2,240);
  z.days.slice().reverse().forEach((d,i)=>{const cx=W-(95+i*148),cy=470,t=tierOf(d.v);x.lineWidth=6;x.strokeStyle='#1f1a2e';
    if(d.v==null){x.setLineDash([12,12]);x.beginPath();x.arc(cx,cy,56,0,7);x.stroke();x.setLineDash([])}
    else{x.fillStyle=t==='great'?'#ff5b2e':t==='good'?'#cbf03a':'#b9a4f7';if(t==='soft'){x.beginPath();x.arc(cx,cy,56,0,7)}else scallop(x,cx,cy,64,12);x.fill();x.stroke();x.fillStyle='#1f1a2e';x.font='46px "Suez One",serif';x.fillText(String(d.v),cx,cy+16)}
    x.fillStyle='#1f1a2e';x.font='700 32px Heebo,sans-serif';x.fillText(WD[pdate(d.s).getDay()],cx,cy-86)});
  const stat=(i,v,l,col)=>{const cx=W-(210+i*330),cy=780;x.fillStyle=col;x.strokeStyle='#1f1a2e';x.lineWidth=6;x.beginPath();x.roundRect(cx-140,cy-90,280,180,36);x.fill();x.stroke();x.fillStyle='#1f1a2e';x.font='90px "Suez One",serif';x.fillText(String(v),cx,cy+10);x.font='34px "Gveret Levin",cursive';x.fillText(l,cx,cy+60)};
  stat(0,z.best?z.best.v:'–','היום הכי טוב','#ddd2fb');stat(1,z.streak,'ימים ברצף','#ffd3e7');stat(2,z.avg==null?'–':z.avg,'ממוצע השבוע','#e7f8a0');
  x.fillStyle='#1f1a2e';x.font='54px "Gveret Levin",cursive';x.fillText(`בממוצע ${fmtNum(z.stepsAvg)} צעדים ביום`,W/2,1030);x.font='70px "Suez One",serif';x.fillText('היום שלי',W/2,1250);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  try{const ok=await saveFile('היום-שלי-גיבוי-שבועי.png',blob);if(ok)toast('התמונה מוכנה')}catch(e){toast('לא הצלחנו להוריד')}
};
PAGES.join=r=>{S.ui.pendingJoin=r.a;if(S.mode==='api'&&!S.user)S.ui.auth=Object.assign(S.ui.auth||{},{tab:'register',email:'',pass:'',err:'',busy:false});setTimeout(()=>go(S.profile?'friends':'welcome'),0);return '<div class="splash">…</div>'};

/* ---------- standalone (own server) mode ---------- */
const Api={
  async call(method,path,body,opt){
    const r=await fetch(path,{method,headers:body!==undefined?{'content-type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined,credentials:'same-origin',keepalive:!!(opt&&opt.keepalive)});
    let j=null;try{j=await r.json()}catch(e){}
    if(!r.ok){const err=Object.assign(new Error((j&&j.error)||'http '+r.status),{code:(j&&j.error)||('http'+r.status),status:r.status,data:j});
      if(r.status===401&&!/\/api\/(login|register|me)$/.test(path))authLost();throw err}
    return j;
  },
  get(p){return this.call('GET',p)},post(p,b){return this.call('POST',p,b===undefined?{}:b)},
  async health(){try{const r=await fetch('/api/health',{credentials:'same-origin'});if(!r.ok)return null;const j=await r.json();return j&&j.app==='daily-planner'?j:null}catch(e){return null}}
};
function authLost(){if(S.mode!=='api'||!S.user)return;S.user=null;S.profile=null;S.days={};Social.on=false;toast('החיבור פג. צריך להתחבר מחדש');go('welcome')}
const AUTH_ERR={bad_credentials:'המייל או הסיסמה לא נכונים',exists:'כבר יש חשבון עם המייל הזה. נסו להתחבר',weak_password:'הסיסמה צריכה להיות באורך 8 תווים לפחות',bad_email:'המייל לא נראה תקין',rate:'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות',signup_closed:'ההרשמה סגורה כרגע'};
function authPanel(){
  const a=S.ui.auth||(S.ui.auth={tab:'login',email:'',pass:'',err:'',busy:false});const reg=a.tab==='register';
  return `<h2 class="suez" style="font-size:clamp(36px,5vw,56px)">${reg?'יוצרים חשבון':'בואו נתחיל'}</h2><p class="ptn">${reg?'חשבון חינמי. הנתונים שלך נשמרים בענן ועובדים בכל מכשיר':'כניסה לדף היומי שלך'}</p>
  <div class="seg" role="tablist"><button class="chip ${!reg?'on':''}" role="tab" aria-selected="${!reg}" data-act="auth-tab" data-t="login">כניסה</button><button class="chip ${reg?'on':''}" role="tab" aria-selected="${reg}" data-act="auth-tab" data-t="register">הרשמה</button></div>
  <div data-submit="auth" class="stack" style="gap:12px"><div class="field"><label for="em">מייל</label><input id="em" class="in" type="email" dir="ltr" style="text-align:left" autocomplete="${reg?'email':'username'}" value="${esc(a.email)}" data-in="auth-email" data-focus="1"></div>
  <div class="field"><label for="pw">סיסמה${reg?' (לפחות 8 תווים)':''}</label><input id="pw" class="in" type="password" dir="ltr" style="text-align:left" autocomplete="${reg?'new-password':'current-password'}" value="${esc(a.pass)}" data-in="auth-pass"></div>
  ${a.err?`<div class="err-t" role="alert">${esc(a.err)}</div>`:''}<button class="btn primary big block" type="button" data-act="submit" ${a.busy?'disabled':''}>${ico('check',22)} ${a.busy?'רגע…':reg?'הרשמה':'כניסה'}</button></div>
  <button class="linkbtn" style="align-self:flex-start" data-act="guest">להמשיך בלי חשבון (נשמר במכשיר הזה בלבד)</button><div class="pts" style="opacity:.6">גרסה ${VERSION}</div>`;
}
ACT['auth-tab']=el=>{const a=S.ui.auth;a.tab=el.dataset.t;a.err='';render(true)};
INP['auth-email']=el=>{S.ui.auth.email=el.value};INP['auth-pass']=el=>{S.ui.auth.pass=el.value};
SUB.auth=async()=>{
  const a=S.ui.auth;if(a.busy)return;if(!a.email.trim()||!a.pass){a.err='צריך למלא מייל וסיסמה';return render(true)}
  a.busy=true;a.err='';render(true);
  try{
    const lc=Store.readLocal();const l=Store.ls();const guestData=l&&l.getItem('dp_guest')==='1'&&lc&&lc.profile?lc:null;
    const r=await Api.call('POST',a.tab==='login'?'/api/login':'/api/register',{email:a.email.trim(),password:a.pass});
    S.user=r.user;S.mode='api';S.guest=false;if(l){l.removeItem('dp_guest');l.removeItem('dp1')}
    await Store.loadApi(guestData);a.busy=false;a.pass='';S.setup=null;
    if(S.profile){Social=SocialApi;await Social.init()}
    toast(a.tab==='login'?'ברוכים השבים!':'החשבון נוצר');go(S.profile?(S.ui.pendingJoin?'friends':'today'):'setup');
  }catch(e){a.busy=false;a.err=AUTH_ERR[e.code]||'משהו השתבש. נסו שוב';render(true)}
};
ACT.guest=()=>{const l=Store.ls();if(l)l.setItem('dp_guest','1');S.mode='local';S.guest=true;S.setup=null;go('setup')};
ACT.logout=async()=>{try{await Api.post('/api/logout')}catch(e){}S.user=null;S.profile=null;S.days={};S.setup=null;S.ui.auth=null;Social.on=false;closePopup();go('welcome');toast('יצאת מהחשבון')};
POP.delacct={label:'מחיקת חשבון',render:d=>`${popTape()}${popHead('מחיקת החשבון')}<p>כל הנתונים שלך יימחקו לצמיתות: משימות, לו״ז, אוכל, חברים וגלויות. אי אפשר לבטל.</p><div class="field"><label for="dp">סיסמה לאישור</label><input id="dp" class="in" type="password" dir="ltr" style="text-align:left" data-in="del-pass" data-focus="1" autocomplete="current-password"></div>${d.err?`<div class="err-t" role="alert">${esc(d.err)}</div>`:''}<div class="acts"><span class="sp"></span><button class="btn secondary" data-act="close-popup">ביטול</button><button class="btn danger" data-act="del-acct-go">למחוק הכול</button></div>`};
ACT['del-acct']=()=>openPopup('delacct',{pass:'',err:''});INP['del-pass']=el=>{S.popup.d.pass=el.value};
ACT['del-acct-go']=async()=>{const d=S.popup.d;try{await Api.post('/api/account/delete',{password:d.pass});S.user=null;S.profile=null;S.days={};Social.on=false;closePopup();go('welcome');toast('החשבון נמחק')}catch(e){d.err=e.code==='bad_credentials'?'הסיסמה לא נכונה':'לא הצלחנו למחוק';renderPopup()}};
/* ---------- social over the API ---------- */
const SocialApi={on:false,err:false,profiles:{},_f:[],_in:[],_out:[],_ci:[],_co:[],timer:null,last:0,lastPub:'',myCode:'',
  async init(){this.on=true;await this.refresh();clearInterval(this.timer);this.timer=setInterval(()=>{if(document.visibilityState==='visible'&&this.on&&['friends','friend','postcards','zine'].includes(S.route.name))this.refresh()},20000)},
  async refresh(){this.last=Date.now();try{const d=await Api.get('/api/social');const pr={};[...d.friends,...d.incoming,...d.outgoing].forEach(p=>{pr[p.id]=p});this.profiles=pr;this._f=d.friends.map(p=>p.id);this._in=d.incoming.map(p=>p.id);this._out=d.outgoing.map(p=>p.id);this._ci=d.cardsIn;this._co=d.cardsOut;this.myCode=d.me.code;if(S.profile)S.profile.code=d.me.code;this.err=false;this.changed()}catch(e){this.err=true}},
  changed(){if(['friends','friend','postcards','zine'].includes(S.route.name))softRender()},
  me(){return S.user?String(S.user.id):''},mine(){return this._f.concat(this._out)},friendIds(){return this._f},incoming(){return this._in},outgoing(){return this._out},
  cardsIn(){return this._ci},get pcOut(){return this._co},touch(){},
  async addByCode(code){try{const r=await Api.post('/api/friends/add',{code});await this.refresh();return r}catch(e){throw{code:e.code==='nf'?'nf':e.code==='dup'?'dup':'err',name:e.data&&e.data.name}}},
  async accept(id){await Api.post('/api/friends/accept',{id});await this.refresh()},
  async remove(id){await Api.post('/api/friends/remove',{id});await this.refresh()},
  async send(doc){const r=await Api.post('/api/postcards',doc);await this.refresh();return r},
};
Store.loadApi=async function(guestData){
  const d=await Api.get('/api/data');S.profile=d.profile&&d.profile.name?d.profile:null;S.days={};for(const k in d.days)S.days[k]=normDay(d.days[k]);
  if(!S.profile&&guestData&&guestData.profile&&guestData.profile.name){S.profile=Object.assign({},guestData.profile,{code:d.profile&&d.profile.code||guestData.profile.code});S.days={};for(const k in guestData.days||{})S.days[k]=normDay(guestData.days[k]);this.saveProfile();for(const k in S.days)this.saveDay(k)}
};

(async function main(){
  render();
  try{await Store.init()}catch(e){console.error(e);try{Store.loadLocal()}catch(_){}}
  S.ready=true;
  try{if(S.mode==='db')await Social.init();else if(S.mode==='api'&&S.user&&S.profile){Social=SocialApi;await Social.init()}}catch(e){console.error(e)}
  render();
})();
